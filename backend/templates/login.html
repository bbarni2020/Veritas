<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        h1 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">Veritas Admin</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to access the admin dashboard</p>
        <div id="error" class="error" aria-live="polite"></div>
        <form id="loginForm">
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
          <button id="loginBtn" type="submit">Sign in</button>
        </form>
        <div class="hint">Contact sysadmin for credential reset</div>
    </div>
    <style>
      .brand{font-weight:700;color:#333;margin-bottom:8px}
      h1{font-size:20px;margin:0;color:#111}
      .subtitle{color:#666;font-size:13px;margin-bottom:16px}
      .error{color:#b00020;margin:8px 0;display:none}
      .hint{color:#888;font-size:12px;margin-top:12px}
      button[disabled]{opacity:0.6;cursor:not-allowed}
    </style>
    <script>
      const form = document.getElementById('loginForm')
      const err = document.getElementById('error')
      const btn = document.getElementById('loginBtn')
      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        err.style.display = 'none'
        btn.disabled = true
        const password = document.getElementById('password').value
        try{
          const res = await fetch('/admin/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({password}) })
          if (!res.ok) {
            const data = await res.json().catch(()=>({detail:'Login failed'}))
            err.textContent = data.detail || 'Login failed'
            err.style.display = 'block'
            btn.disabled = false
            return
          }
          const data = await res.json()
          localStorage.setItem('admin_token', data.token)
          window.location.href = '/admin/dashboard'
        }catch(e){
          err.textContent = 'Network error'
          err.style.display = 'block'
          btn.disabled = false
        }
      })
    </script>
</body>
</html>
