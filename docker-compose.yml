services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: veritaspass
      POSTGRES_DB: veritasdb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"

  backend:
    build: ./backend
    depends_on:
      - db
      - minio
    environment:
      DATABASE_URL: postgresql://veritas:veritaspass@db:5432/veritasdb
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      JWT_SECRET: supersecretchange
    ports:
      - "8000:8000"

volumes:
  db-data:
  minio-data:
